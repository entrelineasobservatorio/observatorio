<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EntreLíneas{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="{{ url_for('index') }}" class="nav-logo">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="EntreLíneas" />
      </a>
      <button class="hamburger" id="hamburger" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="{{ url_for('index') }}"      class="{{ 'active' if request.endpoint == 'index' }}">Inicio</a></li>
        <li><a href="{{ url_for('analisis') }}"     class="{{ 'active' if request.endpoint in ('analisis','post') }}">Análisis</a></li>
        <li><a href="{{ url_for('metodologia') }}" class="{{ 'active' if request.endpoint == 'metodologia' }}">Metodología</a></li>
        <li><a href="{{ url_for('tendencias') }}"  class="{{ 'active' if request.endpoint == 'tendencias' }}">Tendencias</a></li>
        <li><a href="{{ url_for('equipo') }}"     class="{{ 'active' if request.endpoint == 'equipo' }}">Equipo</a></li>
        <li><a href="{{ url_for('nosotros') }}"   class="{{ 'active' if request.endpoint == 'nosotros' }}">Sobre Nosotrxs</a></li>
        <li><a href="{{ url_for('alertas') }}"    class="{{ 'active' if request.endpoint == 'alertas' }}">Alertas</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <a href="{{ url_for('index') }}" class="footer-logo">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="EntreLíneas" />
      </a>
      <p class="footer-tagline">Observatorio de Proyectos de Ley</p>
      <div class="footer-links">
        <a href="https://instagram.com/observatorio_entrelineas" target="_blank" rel="noopener">Instagram</a>
        <a href="mailto:entrelineas.observatorio@gmail.com">Correo</a>
      </div>
      <p class="footer-email">entrelineas.observatorio@gmail.com</p>
      <p class="footer-copy">&copy; 2026 EntreLíneas. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
